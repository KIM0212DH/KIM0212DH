name: Fetch VIX / NASDAQ / KOSPI / VKOSPI data

on:
  workflow_dispatch:
  schedule:
    # 평일 23:30 UTC = 다음날 08:30 KST: 미국장 마감 후, KRX Open API 전일 데이터 갱신(08:00 KST) 후
    - cron: "30 23 * * 1-5"
  push:
    paths:
      - "market_fear/vix_nasdaq_kospi.py"
      - "market_fear/krx_vkospi.py"
      - ".github/workflows/market-data.yml"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r market_fear/requirements.txt
      - name: Download closes and build chart
        working-directory: market_fear
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
        run: |
          mkdir -p data
          # Secret KRX_API_KEY가 있으면 VKOSPI를 새로 받고, 없어도 커밋된 캐시(data/vkospi.csv)는 병합
          VKOSPI_FLAG=""
          if [ -n "$KRX_API_KEY" ] || [ -f data/vkospi.csv ]; then VKOSPI_FLAG="--vkospi"; fi
          python vix_nasdaq_kospi.py --period 5y $VKOSPI_FLAG --csv data/closes_5y.csv --out data/vix_nasdaq_kospi.html
          # 대시보드용 장기 데이터 (VIX·나스닥 1990~, 코스피 1996-12~, VKOSPI 2010-01~)
          python vix_nasdaq_kospi.py --start 1990-01-01 $VKOSPI_FLAG --csv data/closes_long.csv --out /tmp/long.html
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add -f market_fear/data/closes_5y.csv market_fear/data/closes_long.csv
          [ -f market_fear/data/vkospi.csv ] && git add -f market_fear/data/vkospi.csv
          git diff --cached --quiet || git commit -m "Update market data (VIX, NASDAQ, KOSPI, VKOSPI)"
          git push
